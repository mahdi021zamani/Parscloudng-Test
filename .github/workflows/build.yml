name: Build Test APK

# Keep only the newest isolated build for this branch running.
concurrency:
  group: parscloud-hardening-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Test version
        required: false
        default: V26.11.24-device-limits-test
        type: string
  push:
    branches:
      - "work/parscloud-preservation-and-hardening"
      - "work/parcloud-four-profiles-and-core-sync-2026-11-15"
      - "work/parcloud-core-sync-2026-11-15"
      - "work/parcloud-personal-ping-state-2026-11-18"
      - "work/parcloud-personal-management-2026-11-18"
      - "test/offline-grace-2m-2026-11-20"
      - "test/offline-grace-resume-dialog-fix-2026-11-20"
      - "test/offline-grace-auto-revalidation-2026-11-20"
      - "debug/personal-import-background-trace-2026-11-22"
      - "debug/personal-import-lifecycle-trace-2-2026-11-22"
      - "debug/personal-import-final-process-trace-2026-11-22"
      - "feature/parcloud-chrome-ui-complete-safe-merge-2026-11-24"
      - "feature/app-device-registration-limits-2026-11-24"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: stable
      GO_VERSION: '1.26'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Gradle and restore dependency/build caches
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Normalize Android 37 SDK platform path for Gradle
        run: |
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sed -i '10i\
          \
              ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r libs V2rayNG/app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build Aether native components
        run: |
          bash compile-aether.sh
          bash compile-psiphon.sh
          bash compile-pt.sh

      - name: Stage Aether native libraries
        run: |
          cp -r libs-aether/. V2rayNG/app/libs/
          cp -r libs-psiphon/. V2rayNG/app/libs/
          cp -r libs-pt/. V2rayNG/app/libs/

      - name: Fetch Psiphon server list
        run: bash fetch-psiphon-servers.sh

      - name: Verify pinned native core revisions
        run: |
          verify_submodule() {
            local path="$1"
            local expected="$2"
            local actual
            actual=$(git -C "$path" rev-parse HEAD)
            echo "$path: $actual"
            test "$actual" = "$expected"
          }

          verify_submodule aether "d58f9d568083129ce2c767c85054021eb3ee6a38"
          verify_submodule hev-socks5-tunnel "75dbc1e9ace6c70d3d1b94df7c283efe1de7effc"

          cd AndroidLibXrayLite
          git fetch --tags origin
          EXPECTED_COMMIT="dc808073d3faf65819a1925b18f92df9af91cddd"
          TAG_COMMIT=$(git rev-parse "v26.11.21^{commit}")
          CHECKOUT_COMMIT=$(git rev-parse HEAD)
          echo "AndroidLibXrayLite tag: $TAG_COMMIT"
          echo "AndroidLibXrayLite checkout: $CHECKOUT_COMMIT"
          test "$TAG_COMMIT" = "$EXPECTED_COMMIT"
          test "$CHECKOUT_COMMIT" = "$EXPECTED_COMMIT"

      - name: Download pinned libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: patterniha/AndroidLibXrayLite
          tag: v26.11.21
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Verify libv2ray checksum
        run: |
          echo "b92bb266cfddfea2f3d084ceeeaea9c62bc55cf1edb3e67817d6104419374b6d  V2rayNG/app/libs/libv2ray.aar" | sha256sum --check

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate temporary keystore
        run: |
          KEYSTORE_PASS=$(openssl rand -hex 24)
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android_keystore.jks" \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -alias parscloud-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Parscloud Test"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew testFdroidDebugUnitTest testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin licenseFdroidReleaseReport assembleFdroidRelease \
            -PpattngVersion="${{ inputs.release_tag || 'V26.10.11-test' }}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/android_keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="parscloud-test" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload arm64-v8a APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-v8a
          path: V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk
          retention-days: 3
