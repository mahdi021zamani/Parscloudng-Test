name: Build Test APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Test version
        required: false
        default: V26.10.11-test
        type: string
      subscription_api_base_url:
        description: Subscription API environment (Preview by default; Production must be selected explicitly)
        required: true
        default: https://feature-concurrent-connection-lim-parscloud-subscription-server.mahdi021zamani.workers.dev
        type: string
  push:
    branches:
      - main
      - feature/parscloud-subscription-license
      - feature/parscloud-aether-integration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: stable
      GO_VERSION: '1.22'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sed -i '10i\
          \
              ndkVersion = "29.0.14206865"' V2rayNG/app/build.gradle.kts

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r libs V2rayNG/app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build Aether native components
        run: |
          bash compile-aether.sh
          bash compile-psiphon.sh
          bash compile-pt.sh

      - name: Stage Aether native libraries
        run: |
          cp -r libs-aether/. V2rayNG/app/libs/
          cp -r libs-psiphon/. V2rayNG/app/libs/
          cp -r libs-pt/. V2rayNG/app/libs/

      - name: Fetch Psiphon server list
        run: bash fetch-psiphon-servers.sh

      - name: Fetch AndroidLibXrayLite tag
        run: |
          cd AndroidLibXrayLite
          git fetch --tags origin
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG=$(git tag --sort=-version:refname | head -n 1)
          fi
          if [ -z "$CURRENT_TAG" ]; then
            echo "::error::No tags found for AndroidLibXrayLite."
            exit 1
          fi
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: patterniha/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate temporary keystore
        run: |
          KEYSTORE_PASS=$(openssl rand -hex 24)
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android_keystore.jks" \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -alias parscloud-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Parscloud Test"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PARSCLOUD_SUBSCRIPTION_API_BASE_URL: ${{ inputs.subscription_api_base_url }}
        run: |
          case "$PARSCLOUD_SUBSCRIPTION_API_BASE_URL" in
            https://parscloud-subscription-server.mahdi021zamani.workers.dev|https://feature-concurrent-connection-lim-parscloud-subscription-server.mahdi021zamani.workers.dev) ;;
            *) echo "::error::Only the configured Production or Preview subscription API URLs are allowed."; exit 1 ;;
          esac
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew licenseFdroidReleaseReport
          ./gradlew assembleRelease \
            -PpattngVersion="${{ inputs.release_tag || 'V26.10.11-test' }}" \
            -PparscloudSubscriptionApiBaseUrl="$PARSCLOUD_SUBSCRIPTION_API_BASE_URL" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/android_keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="parscloud-test" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload arm64-v8a APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-v8a
          path: V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

      - name: Upload armeabi-v7a APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: armeabi-v7a
          path: V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

      - name: Upload x86 APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: x86-apk
          path: V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

      - name: Upload universal APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: universal-apk
          path: V2rayNG/app/build/outputs/apk/*/release/*universal*.apk
